###############################################################################
# Oracle 19c NON-CDB -> Oracle 26ai CDB/PDB
###############################################################################

#==============================================================================
# LOGIN / SSH
#==============================================================================

LOGIN_USER="dbadmin"

ORACLE_OS_USER="oracle"

SOURCE_HOST="hostabc"
TARGET_HOST="targetabc"

# Private key used by LOGIN_USER to SSH to both servers.
#
# IMPORTANT:
# This is the key on the machine where you execute oracle_migrate.sh.
#
SSH_IDENTITY_FILE="/home/dbadmin/.ssh/id_ed25519_migration"

SSH_BATCH_MODE="yes"
SSH_STRICT_HOST_KEY_CHECKING="yes"
SSH_CONNECT_TIMEOUT="15"


#==============================================================================
# SOURCE ORACLE 19c NON-CDB
#==============================================================================

SOURCE_SID="PROD19"

SOURCE_ORACLE_HOME="/u01/app/oracle/product/19.0.0/dbhome_1"
SOURCE_ORACLE_BASE="/u01/app/oracle"

SOURCE_DATA_DIR="/u02/oradata/PROD19"

SOURCE_STAGE="/u04/oracle_migration"
SOURCE_DP_DIR="/u04/oracle_migration/dpump"


#==============================================================================
# TARGET ORACLE 26ai CDB
#==============================================================================

TARGET_SID="PROD26"

TARGET_ORACLE_HOME="/u01/app/oracle/product/26.0.0/dbhome_1"
TARGET_ORACLE_BASE="/u01/app/oracle"

TARGET_DATA_DIR="/u02/oradata/PROD26"

TARGET_STAGE="/u04/oracle_migration"
TARGET_DP_DIR="/u04/oracle_migration/dpump"

TARGET_PDB="APPDB"

TARGET_PDB_ADMIN="PDBADMIN"

TARGET_PDB_ADMIN_PASSWORD="CHANGE_ME"


#==============================================================================
# DATAPUMP
#==============================================================================

DP_USER="SYSTEM"

DP_PARALLEL=8

DUMP_PREFIX="PROD19_FT"

EXPORT_LOG="${DUMP_PREFIX}_export.log"

IMPORT_LOG="${DUMP_PREFIX}_import.log"

TRANSPORT_DATAFILES_LOG="${DUMP_PREFIX}_transport_datafiles.log"

# Environment variable containing SYSTEM password.
DP_PASSWORD_ENV="MIGRATION_DP_PASSWORD"


#==============================================================================
# TRANSFER
#==============================================================================

RSYNC_PARALLEL=4


#==============================================================================
# SAFETY
#==============================================================================

# YES = simulation / no destructive migration
# NO  = perform actual migration
DRY_RUN="YES"

# Ask before performing migration.
REQUIRE_CONFIRMATION="YES"

# KEEP THIS NO.
#
# Change to YES only if you explicitly want the script to destroy
# an existing target PDB.
ALLOW_DROP_TARGET_PDB="NO"


#==============================================================================
# SOURCE TABLESPACE
#==============================================================================

MANAGE_READONLY="YES"


#==============================================================================
# VALIDATION
#==============================================================================

RUN_ROWCOUNT_VALIDATION="NO"


#==============================================================================
# CLEANUP
#==============================================================================

CLEANUP_AFTER_SUCCESS="NO"
